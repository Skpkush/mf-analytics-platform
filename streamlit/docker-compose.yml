# ============================================================
# Deploy the NAV Forecasting app on the Hostinger VPS.
#
#   cd mf-analytics-platform
#   docker compose -f streamlit/docker-compose.yml up -d --build
#
# CURRENT MODE: direct port (quick test, http only).
# Reachable at:  http://<VPS-IP>:8501
#           or:  http://srv973497.hstgr.cloud:8501  (hostname resolves)
# Make sure port 8501 is open in the VPS / Hostinger firewall.
#
# DB credentials come from the repo .env (point LOCAL_DB_* at Supabase).
#
# To later put this behind Traefik + HTTPS on your own domain, remove
# the `ports:` block and uncomment the `networks:` + `labels:` blocks
# (and the bottom `networks:` definition), then set your Host() rule.
# ============================================================
services:
  mf-nav-app:
    build:
      context: ..
      dockerfile: streamlit/Dockerfile
    image: mf-nav-app:latest
    container_name: mf-nav-app
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8501:8501"
    # --- Traefik mode (uncomment for your own domain + HTTPS) ---
